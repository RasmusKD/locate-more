name: Publish

# Runs on every push (the verify matrix is the point: ONE jar must compile
# against BOTH supported Minecraft versions, which are not source
# compatible) and publishes on version tags:
#   git tag v1.13.0 && git push origin v1.13.0
# Tag as vX.Y.Z and nothing else: mc-publish derives the Modrinth version
# name from the tag.
#
# The golden-file battery (test/run.sh) stays local: it needs the
# unpublished locatemore-lab sibling and a full dev-server run per version.
# Run it on both versions before tagging; CI gates compilation only.
#
# Until the MODRINTH_TOKEN secret exists, the Modrinth step is skipped and
# only the GitHub release is created.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 26.1.2
            fabric: 0.155.2+26.1.2
          - minecraft: "26.2"
            fabric: 0.158.0+26.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build against ${{ matrix.minecraft }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_version=${{ matrix.fabric }}

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changelog is the commit subjects since the
          # previous tag, so shallow clones would leave it empty.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # Every release gets a changelog without anyone writing one: the
      # commit subjects since the previous tag, minus bare version bumps.
      - name: Collect changelog
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "text<<CHANGELOG_EOF"
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "$prev..${GITHUB_REF_NAME}" | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+$' || true
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: 7Rblt26W
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"
