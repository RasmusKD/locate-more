plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "locatemore" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Fails the build if development-only surface leaks into the shipped jar.
tasks.register('verifyJar') {
    dependsOn 'assemble'
    doLast {
        def jarFile = file("build/libs/locatemore-${project.version}.jar")
        // 'locatemorelab' left the list when setLabBypass began gating on
        // isModLoaded("locatemorelab"): the string is now the guard that keeps
        // the lab hook inert in production, not a leaked dev surface.
        def forbidden = ['probeVanilla', 'enableBenchmarkModes', 'apiSmokeTest',
                         'StructureCheckAccessor', 'ServerLevelStructureAccessor']
        def hits = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def data = zip.getInputStream(entry).bytes
                    forbidden.each { lit ->
                        if (new String(data, 'ISO-8859-1').contains(lit)) hits << (entry.name + ': ' + lit)
                    }
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException('Dev surface leaked into the shipped jar: ' + hits)
        }
    }
}
tasks.check.dependsOn 'verifyJar'
