plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// -PmcTarget=26.3 builds the 26.3 jar: pins from gradle-26.3.properties plus the
// sources under src/mc26_3/java, which replace same-named files of src/main/java.
if (project.findProperty('mcTarget') == '26.3') {
    def pins = new Properties()
    file('gradle-26.3.properties').withInputStream { pins.load(it) }
    pins.each { k, v -> project.setProperty(k as String, v as String) }
}
def modern = project.minecraft_version.startsWith('26.3')
def mcLabel = modern ? '26.3' : '26.1'

version = "${project.mod_version}+${mcLabel}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "locatemore" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Bundled (jar-in-jar): without a permissions mod every check falls back
    // to the vanilla op level, so behavior is unchanged for everyone else.
    include(implementation("maven.modrinth:fabric-permissions-api:${project.permissions_api_version}"))
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The pure-math slice: replicated logic with no server, no bootstrap, no
// battery boot. The battery stays the release gate; these catch formula
// regressions in seconds during development.
tasks.named('test') {
    useJUnitPlatform()
}

// The 26.3 jar is built from src/main plus src/mc26_3: a file under src/mc26_3/{java,resources}
// replaces the same-named file of src/main, and src/mc26_3/remove.txt lists src/main files
// (relative to java/ or resources/) that the 26.3 jar drops.
def overlaid = [] as Set
def removed = [] as Set
def overlayRoot = file('src/mc26_3')
['java', 'resources'].each { kind ->
    def dir = new File(overlayRoot, kind)
    if (dir.exists()) {
        dir.eachFileRecurse { f ->
            if (f.isFile()) {
                overlaid << ("${kind}/" + dir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')).toString()
            }
        }
    }
}
def removeList = new File(overlayRoot, 'remove.txt')
if (removeList.exists()) {
    removeList.eachLine { l -> if (l.trim() && !l.startsWith('#')) removed << l.trim() }
}
def replacedInMain = { String kind, element ->
    def path = element.file.path.replace(File.separator, '/')
    element.file.isFile() && path.contains("/src/main/${kind}/") &&
            (overlaid.contains("${kind}/${element.relativePath.pathString}".toString()) ||
                    removed.contains("${kind}/${element.relativePath.pathString}".toString()))
}
if (modern) {
    sourceSets.main.java {
        srcDir 'src/mc26_3/java'
        exclude { element -> replacedInMain('java', element) }
    }
    sourceSets.main.resources {
        srcDir 'src/mc26_3/resources'
        exclude { element -> replacedInMain('resources', element) }
    }
}

def mcRange = modern ? '>=26.3' : '>=26.1 <26.3'

processResources {
    inputs.property "mc_range", mcRange
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version,
                "mc_range": mcRange
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Fails the build if development-only surface leaks into the shipped jar.
tasks.register('verifyJar') {
    dependsOn 'assemble'
    doLast {
        def jarFile = file("build/libs/locatemore-${project.version}.jar")
        // 'locatemorelab' left the list when setLabBypass began gating on
        // isModLoaded("locatemorelab"): the string is now the guard that keeps
        // the lab hook inert in production, not a leaked dev surface.
        def forbidden = ['probeVanilla', 'enableBenchmarkModes', 'apiSmokeTest',
                         'StructureCheckAccessor', 'ServerLevelStructureAccessor']
        def hits = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def data = zip.getInputStream(entry).bytes
                    forbidden.each { lit ->
                        if (new String(data, 'ISO-8859-1').contains(lit)) hits << (entry.name + ': ' + lit)
                    }
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException('Dev surface leaked into the shipped jar: ' + hits)
        }
    }
}
tasks.check.dependsOn 'verifyJar'

// Every mixin a config lists must be a compiled class of this variant's jar.
tasks.register('verifyMixinClasses') {
    dependsOn tasks.named('classes')
    doLast {
        def classesDir = sourceSets.main.java.destinationDirectory.get().asFile
        def resDir = sourceSets.main.output.resourcesDir
        resDir.eachFileMatch(~/.*\.mixins\.json/) { cfg ->
            def json = new groovy.json.JsonSlurper().parse(cfg)
            def names = (json.mixins ?: []) + (json.client ?: []) + (json.server ?: [])
            names.each { n ->
                def cls = new File(classesDir, "${json.package.replace('.', '/')}/${n.replace('.', '/')}.class")
                if (!cls.exists()) {
                    throw new GradleException("${cfg.name} lists ${json.package}.${n}, which is not compiled in this variant")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyMixinClasses' }
